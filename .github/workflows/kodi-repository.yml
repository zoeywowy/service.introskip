name: Build and deploy Kodi repository to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kodi-repository.yml"
      - "tools/build_kodi_repository.py"
      - "build_zip.py"
      - "addon.xml"
      - "main.py"
      - "service.py"
      - "resources/**"
      - "icon.png"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-kodi-repository:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Kodi-standard repository tree and bootstrap installer
        run: python tools/build_kodi_repository.py

      - name: Verify Kodi repository index, MD5 and package layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile

          root = Path("repository/zips")
          raw = "https://raw.githubusercontent.com/zoeywowy/service.introskip/main/repository/zips/"
          data = (root / "addons.xml").read_bytes()
          index = ET.fromstring(data)
          assert index.tag == "addons"
          ids = {addon.get("id") for addon in index}
          assert ids == {"service.introskip", "repository.introskip"}, ids
          digest = hashlib.md5(data).hexdigest()
          assert (root / "addons.xml.md5").read_text() == digest

          repository = next(a for a in index if a.get("id") == "repository.introskip")
          directory = repository.find("./extension[@point='xbmc.addon.repository']/dir")
          assert directory is not None
          assert directory.findtext("info") == raw + "addons.xml"
          assert directory.find("info").get("compressed") == "false"
          assert directory.findtext("checksum") == raw + "addons.xml.md5"
          assert directory.findtext("datadir") == raw
          assert directory.find("datadir").get("zip") == "true"
          assert directory.find("hashes") is None

          for addon_id in ("repository.introskip", "service.introskip"):
              addon_dir = root / addon_id
              manifest = ET.parse(addon_dir / "addon.xml").getroot()
              assert manifest.get("id") == addon_id
              version = manifest.get("version")
              archive = addon_dir / f"{addon_id}-{version}.zip"
              assert archive.is_file()
              assert (addon_dir / "icon.png").is_file()
              with ZipFile(archive) as package:
                  assert package.testzip() is None
                  assert f"{addon_id}/addon.xml" in package.namelist()
                  packaged = ET.fromstring(package.read(f"{addon_id}/addon.xml"))
                  assert packaged.get("id") == addon_id
                  assert packaged.get("version") == version

          bootstrap = Path("docs/repository.introskip-1.0.3.zip")
          assert bootstrap.is_file()
          with ZipFile(bootstrap) as package:
              assert package.testzip() is None
              assert "repository.introskip/addon.xml" in package.namelist()
          assert (Path("docs") / "index.html").is_file()
          print("Kodi-standard index, MD5, datadir and both ZIP packages verified")
          PY

      - name: Commit generated repository files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f repository/zips/
          git add -f docs/.nojekyll docs/index.html docs/repository.introskip-1.0.3.zip
          git add -u docs
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Kodi-standard repository tree"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload GitHub Pages bootstrap page
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy GitHub Pages bootstrap page
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public raw GitHub repository endpoints
        run: |
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 3 \
            "https://raw.githubusercontent.com/zoeywowy/service.introskip/main/repository/zips/addons.xml" \
            -o /tmp/introskip-addons.xml
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 3 \
            "https://raw.githubusercontent.com/zoeywowy/service.introskip/main/repository/zips/addons.xml.md5" \
            -o /tmp/introskip-addons.xml.md5
          test "$(cat /tmp/introskip-addons.xml.md5)" = "$(md5sum /tmp/introskip-addons.xml | cut -d ' ' -f 1)"
          echo "Public raw GitHub index and MD5 are reachable and match"
