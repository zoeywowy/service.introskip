name: Build and deploy Kodi repository to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kodi-repository.yml"
      - "tools/build_kodi_repository.py"
      - "build_zip.py"
      - "addon.xml"
      - "main.py"
      - "service.py"
      - "resources/**"
      - "icon.png"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-kodi-repository:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build repository ZIP, IntroSkip ZIP and Kodi index
        run: python tools/build_kodi_repository.py

      - name: Verify Kodi index and installers
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile

          docs = Path("docs")
          data = (docs / "addons.xml").read_bytes()
          index = ET.fromstring(data)
          assert index.tag == "addons"
          ids = {addon.get("id") for addon in index}
          assert ids == {"service.introskip", "repository.introskip"}, ids
          assert (docs / "addons.xml.md5").read_text() == hashlib.md5(data).hexdigest()
          for name, root_file in [
              ("repository.introskip-1.0.1.zip", "repository.introskip/addon.xml"),
              ("service.introskip/service.introskip-0.0.24.zip", "service.introskip/addon.xml"),
          ]:
              with ZipFile(docs / name) as z:
                  assert z.testzip() is None
                  assert root_file in z.namelist()
          assert (docs / "index.html").is_file()
          for addon_id in ("repository.introskip", "service.introskip"):
              assert (docs / addon_id / "icon.png").is_file()
          service = next(a for a in index if a.get("id") == "service.introskip")
          deps = {d.get("addon"): d.get("version") for d in service.findall("./requires/import")}
          assert deps["xbmc.python"] == "3.1.0", deps
          assert deps.get("script.module.requests"), deps
          print("Kodi repository index and both installer ZIPs verified")
          PY

      - name: Commit generated repository files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/.nojekyll docs/index.html docs/addons.xml docs/addons.xml.md5
          git add -f docs/repository.introskip-1.0.1.zip docs/repository.introskip/ docs/service.introskip/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Kodi repository index and installer ZIPs"
            git push origin HEAD:main
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy Kodi repository website
        id: deployment
        uses: actions/deploy-pages@v4
