name: Build Kodi repository for GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kodi-repository.yml"
      - "tools/build_kodi_repository.py"
      - "build_zip.py"
      - "addon.xml"
      - "main.py"
      - "service.py"
      - "resources/**"
      - "icon.png"

permissions:
  contents: write

jobs:
  publish-kodi-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build repository ZIP, IntroSkip ZIP and Kodi index
        run: python tools/build_kodi_repository.py

      - name: Verify Kodi index and installers
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile

          docs = Path("docs")
          data = (docs / "addons.xml").read_bytes()
          index = ET.fromstring(data)
          assert index.tag == "addons"
          ids = {addon.get("id") for addon in index}
          assert ids == {"service.introskip", "repository.introskip"}, ids
          assert (docs / "addons.xml.md5").read_text() == hashlib.md5(data).hexdigest()
          for name, root_file in [
              ("repository.introskip-1.0.0.zip", "repository.introskip/addon.xml"),
              ("service.introskip/service.introskip-0.0.23.zip", "service.introskip/addon.xml"),
          ]:
              with ZipFile(docs / name) as z:
                  assert z.testzip() is None
                  assert root_file in z.namelist()
          assert "repository.introskip-1.0.0.zip" in (docs / "index.html").read_text()
          print("Kodi GitHub Pages repository verified")
          PY

      - name: Commit generated site to main for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/.nojekyll docs/index.html docs/addons.xml docs/addons.xml.md5
          git add -f docs/repository.introskip-1.0.0.zip docs/repository.introskip/ docs/service.introskip/
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Kodi repository index and installer ZIPs"
            git push origin HEAD:main
          fi
